# =============================================================================
#  run_config.ini -- 整个程序的入口配置（改这里，不用重新编译）
#  ---------------------------------------------------------------------------
#  用法：cmd 进入本目录（agf2），直接运行：
#            bin\agf.exe
#        程序会自动找到本文件，按下面的配置跑。
#
#  路径规则：相对路径 = 相对【本文件所在目录】解析；也可写绝对路径。
#  input 是【目录】-> 批量处理（noisy 与 gt 两个文件夹按文件名排序后逐张对应）
#  input 是【文件】-> 只处理这一张
# =============================================================================

# ---------- 读取路径 ----------
# 噪声图目录（内含 *.png，按文件名升序排序）
input  = noisy_images

# ---------- 写入路径 ----------
# 输出目录；留空 = 只算不写盘。目录不存在会自动创建，文件名沿用噪声图的文件名
output = out_images

# ---------- 是否存在真值图像（有就顺便算 PSNR） ----------
has_gt = true
# 真值图目录：与 input 的噪声图按【各自按文件名排序后的顺序】一一对应
gt     = truth_images

# ---------- 去噪参数（删掉某行就用 agf.h 中 AgfParams 的默认值） ----------
# 下面给的是实测最优配置
tiled  = true      # 分块滑窗（false = 全图平面式）
tw     = 384       # tile 宽（8 的倍数）
th     = 384       # tile 高（8 的倍数）
halo   = 16        # halo（8 的倍数，16 足够）
nt     = 8         # 线程数（实测 8 线程打满内存带宽）
thr    = 0.5       # 硬 mask 阈值
# half   = false   # true = 先 2x2 降采样到半分辨率去噪再放大（更快、PSNR 略降 ~1.1 dB）
# stream = false   # true = 引导图 1x 层流式（实验性，更慢）
# verbose = false  # true = 打印各相位耗时
